name: auto-update

# Detect new stable upstream releases for the templates in tools/update-tiers (tiers auto and review),
# bump, build and test them, open one PR per passing bump (tier auto: merged and published; tier review:
# left for you to merge, the next run then publishes it). Runs on a schedule or by hand; never on
# pull_request or any fork-driven trigger.
#
# Two jobs on purpose. `build` runs third-party build scripts, so it is read-only: no secrets, a
# read-only token and no persisted git credentials. It hands over plain data as an artifact.
# `publish` runs on a fresh runner from the trusted checkout only, treats the artifact as untrusted
# data (tools/ci-publish.sh validates it before anything is pushed or signed) and is the only job
# with a write token and the signing key.
on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:
    inputs:
      pkg:
        description: "Only this package (overlay template name); ignores the tiers (an unlisted or manual package is handled like tier auto)"
        required: false
        type: string

# one run at a time: it rewrites the whole release
concurrency:
  group: voidlab-release
  cancel-in-progress: false

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    permissions:
      contents: read
    container:
      image: ghcr.io/void-linux/void-glibc-full:latest
      # xbps-src builds in a chroot, which needs the privileges
      options: --privileged
      volumes:
        - /dev:/dev
    steps:
      - name: Install git
        run: |
          mkdir -p /etc/xbps.d && cp /usr/share/xbps.d/*-repository-*.conf /etc/xbps.d/
          sed -i 's|repo-default|repo-ci|g' /etc/xbps.d/*-repository-*.conf
          xbps-install -Syu xbps && xbps-install -y git

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Prepare container
        run: sh tools/ci-prepare.sh

      - name: Bump, build, test
        env:
          GH_TOKEN: ${{ github.token }}
          VOIDLAB_GH_REPO: ${{ github.repository }}
          INPUT_PKG: ${{ inputs.pkg }}
          VOIDLAB_CHROOT_CMD: uchroot
          AUTO_UPDATE_SUMMARY: /tmp/auto-update-summary.md
        run: |
          chown -R builder:builder "$GITHUB_WORKSPACE"
          sudo -Eu builder env HOME=/home/builder bash tools/ci-build.sh

      - name: Job summary
        if: always()
        run: cat /tmp/auto-update-summary.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: build-out
          path: out
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      pull-requests: write
      issues: write
    container:
      image: ghcr.io/void-linux/void-glibc-full:latest
    steps:
      - name: Install git
        run: |
          mkdir -p /etc/xbps.d && cp /usr/share/xbps.d/*-repository-*.conf /etc/xbps.d/
          sed -i 's|repo-default|repo-ci|g' /etc/xbps.d/*-repository-*.conf
          xbps-install -Syu xbps && xbps-install -y git

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Prepare container
        run: sh tools/ci-prepare.sh

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: build-out
          path: ${{ runner.temp }}/build-out

      - name: Validate, merge, publish
        env:
          GH_TOKEN: ${{ github.token }}
          VOIDLAB_GH_REPO: ${{ github.repository }}
          VOIDLAB_PRIVKEY: ${{ secrets.VOIDLAB_PRIVKEY }}
          VOIDLAB_KEY: /tmp/voidlab-key.pem
          BUILD_OUT: ${{ runner.temp }}/build-out
          INPUT_PKG: ${{ inputs.pkg }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: bash tools/ci-publish.sh
